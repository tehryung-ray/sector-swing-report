name: 매일 아침 리포트

# UTC 21:50 = KST 06:50. KST 월~금 아침에 돌려야 하므로 UTC 요일은 일~목(0-4)이다.
# 1-5 로 두면 KST 화~토가 되어 월요일 리포트가 빠지고 토요일에 헛돈다.
on:
  schedule:
    # GitHub 크론은 최선 노력이라 지연되거나 아예 버려진다(공식 문서 명시).
    # 실제로 2026-09-09 에 06:50 은 누락되고 07:50 이 52분 늦게 돌았다.
    # 그래서 한 번이 아니라 창을 넓게 잡고 여러 번 시도한다.
    # 먼저 성공한 실행이 리포트를 만들고, 나머지는 SKIP_IF_DONE 으로 즉시 종료한다.
    - cron: '50 21 * * 0-4'   # KST 06:50
    - cron: '0  22 * * 0-4'   # KST 07:00
    - cron: '10 22 * * 0-4'   # KST 07:10
    - cron: '25 22 * * 0-4'   # KST 07:25
    - cron: '40 22 * * 0-4'   # KST 07:40
    - cron: '55 22 * * 0-4'   # KST 07:55
    - cron: '10 23 * * 0-4'   # KST 08:10 (마지막 기회, 개장 50분 전)
  workflow_dispatch:
    inputs:
      force:
        description: '휴장일에도 강제로 생성'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # OHLCV parquet 캐시. 세 데이터 소스가 모두 죽은 날의 안전망이다.
      # git 에 커밋하면 봇 커밋과 로컬 커밋이 만날 때마다 바이너리 충돌이 나서
      # 리포 밖(Actions 캐시)에 둔다. restore-keys 로 직전 실행분을 복원한다.
      - uses: actions/cache@v6
        with:
          path: cache
          key: krcache-${{ github.run_id }}
          restore-keys: krcache-

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 가격 계산이 깨진 채로 리포트가 나가는 것보다, 아예 안 나가는 게 낫다.
      - name: 계산 로직 테스트
        run: python -m pytest tests/ -q

      - name: 리포트 생성
        env:
          # 없으면 뉴스 분류가 키워드 사전으로 폴백한다. 리포트는 정상 생성된다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 07:50 재시도는 06:50 이 이미 성공했으면 중복 생성하지 않는다.
          # 스케줄 실행은 전부 '이미 됐으면 건너뛴다'. 수동 실행은 항상 새로 만든다.
          SKIP_IF_DONE: ${{ github.event_name == 'schedule' && '1' || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python -m pipeline.main

      - name: 결과 커밋
        run: |
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략 (휴장일이거나 재시도 스킵)"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "report: $(TZ=Asia/Seoul date +%F)"
          git push

      - name: 요약
        if: always()
        run: |
          if [ -f docs/data/latest.json ]; then
            python - <<'PY'
          import json
          d = json.load(open("docs/data/latest.json", encoding="utf-8"))
          print(f"기준일 {d['report_date']} | 추천 {d['counts']['picks']} | 관망 {d['counts']['watch']}")
          print(f"신선도 {d['freshness']['status']} | {d['headline'][:80]}")
          PY
          fi
